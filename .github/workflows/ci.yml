name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11'
  ALL_SERVICES: '["api-gateway","auth-service","chat-service","event-service","financial-service","member-service","notification-service","prayer-service","schedule-service","worship-service"]'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only HEAD~1 -- apps/ | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            if [ "$CHANGED" = "[]" ]; then
              echo "services=${{ env.ALL_SERVICES }}" >> "$GITHUB_OUTPUT"
            else
              echo "services=$CHANGED" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "services=${{ env.ALL_SERVICES }}" >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test, detect-changes]
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: church-app/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
