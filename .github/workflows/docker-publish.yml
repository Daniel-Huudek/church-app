name: Docker Publish

# Build images on GitHub (not on the 4GB VPS) and push to GHCR.
# VPS should only: docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && up -d

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/daniel-huudek/church-app

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: api-gateway
            port: "3030"
            package: "@church-app/api-gateway"
            prisma: "false"
          - service: auth-service
            port: "3001"
            package: "@church-app/auth-service"
            prisma: "true"
          - service: member-service
            port: "3006"
            package: "@church-app/member-service"
            prisma: "true"
          - service: schedule-service
            port: "3003"
            package: "@church-app/schedule-service"
            prisma: "true"
          - service: event-service
            port: "3004"
            package: "@church-app/event-service"
            prisma: "true"
          - service: notification-service
            port: "3005"
            package: "@church-app/notification-service"
            prisma: "true"
          - service: prayer-service
            port: "3007"
            package: "@church-app/prayer-service"
            prisma: "true"
          - service: financial-service
            port: "3008"
            package: "@church-app/financial-service"
            prisma: "true"
          - service: worship-service
            port: "3010"
            package: "@church-app/worship-service"
            prisma: "true"
          - service: chat-service
            port: "3002"
            package: "@church-app/chat-service"
            prisma: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
            PACKAGE_NAME=${{ matrix.package }}
            HAS_PRISMA=${{ matrix.prisma }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
