# Optional override — BUILD ONLY on PC or CI (never on the 4GB VPS).
#   DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml -f docker-compose.build.yml build --parallel 1
#   ./scripts/docker-build-push-pc.sh

services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: api-gateway
        PORT: "3030"
        PACKAGE_NAME: "@church-app/api-gateway"
        HAS_PRISMA: "false"

  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: auth-service
        PORT: "3001"
        PACKAGE_NAME: "@church-app/auth-service"
        HAS_PRISMA: "true"

  member-service:
