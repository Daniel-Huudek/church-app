# Optional override — BUILD ONLY on PC or CI (never on the 4GB VPS).
#   DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml -f docker-compose.build.yml build --parallel 1
#   ./scripts/docker-build-push-pc.sh

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: api
        PORT: "3030"
        PACKAGE_NAME: "@church-app/api"
        HAS_PRISMA: "true"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${WEB_API_URL:-https://api.ipiavare.com.br}

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        API_URL: ${WEB_API_URL:-https://api.ipiavare.com.br}
