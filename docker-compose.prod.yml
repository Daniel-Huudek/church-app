# Production override — NEVER build on the VPS.
# Usage:
#   export IMAGE_TAG=latest   # or a git sha from GHCR
#   ./scripts/docker-deploy-vps.sh
#
# Dokploy: use compose files docker-compose.yml + docker-compose.prod.yml
# and disable build-on-deploy (pull only).

services:
  api-gateway:
    image: ghcr.io/daniel-huudek/church-app/api-gateway:${IMAGE_TAG:-latest}
    pull_policy: always
    build: !reset null

  auth-service:
    image: ghcr.io/daniel-huudek/church-app/auth-service:${IMAGE_TAG:-latest}
    pull_policy: always
    build: !reset null

  member-service:
