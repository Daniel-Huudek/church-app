# Church App — Docker Compose (Dokploy / VPS)
#
# BEST PRACTICE for 4GB VPS + Dokploy:
#   1) Build images on GitHub Actions or your PC → push to GHCR
#   2) Dokploy only PULLS and runs (this file has NO build: section)
#
# Dokploy settings:
#   - Compose file: docker-compose.yml  (only this file)
#   - Disable "build on deploy" / use auto-deploy from git after images are published
#   - Env vars: copy from .env.example (JWT_SECRET, POSTGRES_*, etc.)
#
# Publish images (pick one):
#   A) GitHub → Actions → "Docker Publish" → Run workflow
#   B) PC: ./scripts/docker-build-push-pc.sh
#
# Guide: docs/deploy-dokploy.md

services:
  api:
    image: ghcr.io/daniel-huudek/church-app/api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: church-app-api
    restart: unless-stopped
    ports:
      - "3030:3030"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.ipiavare.com.br`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3030"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=192
      - PORT=3030
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/church_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3030/auth/google/callback}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 320m
    mem_reservation: 128m
    cpus: 0.50

  postgres-db:
    image: postgres:16-alpine
    container_name: church-app-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=church_db
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_connections=100
      - -c
      - work_mem=2MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.40

networks:
  church-app-network:
    driver: bridge

volumes:
  postgres-data:
