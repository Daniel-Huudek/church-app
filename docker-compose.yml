# Church App — Docker Compose
#
# *** VPS 4GB / Dokploy: DO NOT BUILD HERE ***
# Runtime already uses ~1.2GB. A local `docker compose build` will freeze the VPS.
#
# Deploy (pull only):
#   ./scripts/docker-deploy-vps.sh
#   # or:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# Images are built on your PC or GitHub Actions → ghcr.io/daniel-huudek/church-app/<service>
# PC build+push:
#   ./scripts/docker-build-push-pc.sh
#   # see docs/deploy-pc-vps.md
# Local/dev build only (no push):
#   DOCKER_BUILDKIT=1 docker compose build --parallel 1

services:
  api-gateway:
    image: ghcr.io/daniel-huudek/church-app/api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: api-gateway
        PORT: "3030"
        PACKAGE_NAME: "@church-app/api-gateway"
        HAS_PRISMA: "false"
    container_name: church-app-api-gateway
    restart: unless-stopped
    ports:
      - "3030:3030"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`api.ipiavare.com.br`)"
      - "traefik.http.routers.api-gateway.entrypoints=websecure"
      - "traefik.http.routers.api-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=3030"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=96
      - PORT=3030
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MEMBER_SERVICE_URL=http://member-service:3006
      - SCHEDULE_SERVICE_URL=http://schedule-service:3003
      - EVENT_SERVICE_URL=http://event-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
      - PRAYER_SERVICE_URL=http://prayer-service:3007
      - FINANCIAL_SERVICE_URL=http://financial-service:3008
      - CHAT_SERVICE_URL=http://chat-service:3002
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3030/auth/google/callback}
    depends_on:
      auth-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      schedule-service:
        condition: service_started
      event-service:
        condition: service_started
      notification-service:
        condition: service_started
      prayer-service:
        condition: service_started
      financial-service:
        condition: service_started
      chat-service:
        condition: service_started
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 128m
    mem_reservation: 48m
    cpus: 0.20

  auth-service:
    image: ghcr.io/daniel-huudek/church-app/auth-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: auth-service
        PORT: "3001"
        PACKAGE_NAME: "@church-app/auth-service"
        HAS_PRISMA: "true"
    container_name: church-app-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=112
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/auth_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3030/auth/google/callback}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 160m
