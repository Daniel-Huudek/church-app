# Church App — Docker Compose (Dokploy / VPS)
#
# BEST PRACTICE for 4GB VPS + Dokploy:
#   1) Build images on GitHub Actions or your PC → push to GHCR
#   2) Dokploy only PULLS and runs (this file has NO build: section)
#
# Dokploy settings:
#   - Compose file: docker-compose.yml  (only this file)
#   - Disable "build on deploy" / use auto-deploy from git after images are published
#   - Env vars: copy from .env.example (JWT_SECRET, POSTGRES_*, WEB_API_URL, etc.)
#   - Domains tab: add domain for service `api` (port 3030) and `web` (port 80)
#
# Publish images (pick one):
#   A) GitHub → Actions → "Docker Publish" → Run workflow
#   B) PC: ./scripts/docker-build-push-pc.sh
#
# Guide: docs/deploy-dokploy.md

services:
  api:
    image: ghcr.io/daniel-huudek/church-app/api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: church-app-api
    restart: unless-stopped
    ports:
      - "3030:3030"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.api.rule=Host(`api.ipiavare.com.br`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3030"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=192
      - PORT=3030
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/church_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3030/auth/google/callback}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_PUBLIC_BASE_URL=${AWS_S3_PUBLIC_BASE_URL:-}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - church-app-network
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 320m
    mem_reservation: 128m
    cpus: 0.50

  web:
    image: ghcr.io/daniel-huudek/church-app/web:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: church-app-web
    restart: unless-stopped
    # Host port for quick checks (http://IP:8088). Prefer Domains tab in Dokploy.
    ports:
      - "8088:80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.web.rule=Host(`ipiavare.com.br`) || Host(`www.ipiavare.com.br`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=80"
    environment:
      - WEB_API_URL=${WEB_API_URL:-https://api.ipiavare.com.br}
    networks:
      - church-app-network
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.20

  postgres-db:
    image: postgres:16-alpine
    container_name: church-app-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=church_db
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_connections=100
      - -c
      - work_mem=2MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - church-app-network
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.40

networks:
  church-app-network:
    driver: bridge
  # Required so Traefik (Dokploy) can reach api/web. Exists on the Dokploy host.
  dokploy-network:
    external: true

volumes:
  postgres-data:
