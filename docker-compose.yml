version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: church-app-api-gateway
    ports:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MEMBER_SERVICE_URL=http://member-service:3006
      - SCHEDULE_SERVICE_URL=http://schedule-service:3003
      - EVENT_SERVICE_URL=http://event-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
      - PRAYER_SERVICE_URL=http://prayer-service:3007
      - FINANCIAL_SERVICE_URL=http://financial-service:3008
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      auth-service:
        condition: service_started
      member-service:
        condition: service_started
      schedule-service:
        condition: service_started
      event-service:
        condition: service_started
      notification-service:
        condition: service_started
      prayer-service:
        condition: service_started
      financial-service:
        condition: service_started
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: church-app-auth-service
    ports:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church123}@postgres-auth:5432/auth_db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  member-service:
    build:
      context: .
      dockerfile: apps/member-service/Dockerfile
    container_name: church-app-member-service
    ports:
      - "3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=postgresql://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church123}@postgres-member:5432/member_db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres-member:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  schedule-service:
    build:
      context: .
      dockerfile: apps/schedule-service/Dockerfile
    container_name: church-app-schedule-service
    ports:
      - "3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church123}@postgres-schedule:5432/schedule_db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres-schedule:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  event-service:
    build:
      context: .
      dockerfile: apps/event-service/Dockerfile
    container_name: church-app-event-service
    ports:
      - "3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church123}@postgres-event:5432/event_db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres-event:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: church-app-notification-service
    ports:
      - "3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church123}@postgres-notification:5432/notification_db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    depends_on:
      postgres-notification:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  prayer-service:
    build:
      context: .
      dockerfile: apps/prayer-service/Dockerfile
    container_name: church-app-prayer-service
    ports:
      - "3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church123}@postgres-prayer:5432/prayer_db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres-prayer:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  financial-service:
    build:
      context: .
      dockerfile: apps/financial-service/Dockerfile
    container_name: church-app-financial-service
    ports:
      - "3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
      - DATABASE_URL=postgresql://${POSTGRES_USER:-church}:${POSTGRES_PASSWORD:-church123}@postgres-financial:5432/financial_db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      postgres-financial:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-auth:
    image: postgres:16-alpine
    container_name: church-app-postgres-auth
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-church}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-church123}
      - POSTGRES_DB=auth_db
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-church} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-member:
    image: postgres:16-alpine
    container_name: church-app-postgres-member
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-church}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-church123}
      - POSTGRES_DB=member_db
    volumes:
      - postgres-member-data:/var/lib/postgresql/data
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-church} -d member_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-schedule:
    image: postgres:16-alpine
    container_name: church-app-postgres-schedule
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-church}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-church123}
      - POSTGRES_DB=schedule_db
    volumes:
      - postgres-schedule-data:/var/lib/postgresql/data
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-church} -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-event:
    image: postgres:16-alpine
    container_name: church-app-postgres-event
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-church}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-church123}
      - POSTGRES_DB=event_db
    volumes:
      - postgres-event-data:/var/lib/postgresql/data
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-church} -d event_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:16-alpine
    container_name: church-app-postgres-notification
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-church}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-church123}
      - POSTGRES_DB=notification_db
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-church} -d notification_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-prayer:
    image: postgres:16-alpine
    container_name: church-app-postgres-prayer
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-church}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-church123}
      - POSTGRES_DB=prayer_db
    volumes:
      - postgres-prayer-data:/var/lib/postgresql/data
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-church} -d prayer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-financial:
    image: postgres:16-alpine
    container_name: church-app-postgres-financial
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-church}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-church123}
      - POSTGRES_DB=financial_db
    volumes:
      - postgres-financial-data:/var/lib/postgresql/data
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-church} -d financial_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  church-app-network:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-member-data:
  postgres-schedule-data:
  postgres-event-data:
  postgres-notification-data:
  postgres-prayer-data:
  postgres-financial-data:
