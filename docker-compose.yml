services:
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: church-app-api-gateway
    restart: unless-stopped
    ports:
      - "3030:3030"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`api.ipiavare.com.br`)"
      - "traefik.http.routers.api-gateway.entrypoints=websecure"
      - "traefik.http.routers.api-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MEMBER_SERVICE_URL=http://member-service:3006
      - SCHEDULE_SERVICE_URL=http://schedule-service:3003
      - EVENT_SERVICE_URL=http://event-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
      - PRAYER_SERVICE_URL=http://prayer-service:3007
      - FINANCIAL_SERVICE_URL=http://financial-service:3008
      - CHAT_SERVICE_URL=http://chat-service:3002
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3030/auth/google/callback}
    depends_on:
      auth-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      prayer-service:
        condition: service_healthy
      financial-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: church-app-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/auth_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3030/auth/google/callback}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25

  member-service:
