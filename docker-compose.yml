# Church App — Docker Compose (Dokploy / VPS)
#
# BEST PRACTICE for 4GB VPS + Dokploy:
#   1) Build images on GitHub Actions or your PC → push to GHCR
#   2) Dokploy only PULLS and runs (this file has NO build: section)
#
# Dokploy settings:
#   - Compose file: docker-compose.yml  (only this file)
#   - Disable "build on deploy" / use auto-deploy from git after images are published
#   - Env vars: copy from .env.example (JWT_SECRET, POSTGRES_*, etc.)
#
# Publish images (pick one):
#   A) GitHub → Actions → "Docker Publish" → Run workflow
#   B) PC: ./scripts/docker-build-push-pc.sh
#
# Guide: docs/deploy-dokploy.md

services:
  api-gateway:
    image: ghcr.io/daniel-huudek/church-app/api-gateway:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: church-app-api-gateway
    restart: unless-stopped
    ports:
      - "3030:3030"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`api.ipiavare.com.br`)"
      - "traefik.http.routers.api-gateway.entrypoints=websecure"
      - "traefik.http.routers.api-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=3030"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=96
      - PORT=3030
      - AUTH_SERVICE_URL=http://auth-service:3001
      - MEMBER_SERVICE_URL=http://member-service:3006
      - SCHEDULE_SERVICE_URL=http://schedule-service:3003
      - EVENT_SERVICE_URL=http://event-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
      - PRAYER_SERVICE_URL=http://prayer-service:3007
      - FINANCIAL_SERVICE_URL=http://financial-service:3008
      - CHAT_SERVICE_URL=http://chat-service:3002
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3030/auth/google/callback}
    depends_on:
      auth-service:
        condition: service_healthy
      member-service:
        condition: service_started
      schedule-service:
        condition: service_started
      event-service:
        condition: service_started
      notification-service:
        condition: service_started
      prayer-service:
        condition: service_started
      financial-service:
        condition: service_started
      chat-service:
        condition: service_started
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 128m
    mem_reservation: 48m
    cpus: 0.20

  auth-service:
    image: ghcr.io/daniel-huudek/church-app/auth-service:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: church-app-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=112
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/auth_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3030/auth/google/callback}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - church-app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 160m
    mem_reservation: 48m
    cpus: 0.20

