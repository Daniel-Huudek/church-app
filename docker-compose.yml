# Church App — Docker Compose (Dokploy / VPS)
#
# BEST PRACTICE for 4GB VPS + Dokploy:
#   1) Build images on GitHub Actions or your PC → push to GHCR
#   2) Dokploy only PULLS and runs (this file has NO build: section)
#
# Dokploy:
#   - Compose file: docker-compose.yml
#   - Domains tab (NOT Traefik labels here):
#       api  → service `api`  → port 3030
#       site → service `web`  → port 80
#   - Environment: set WEB_API_URL (public API URL for the browser)
#   - Disable "build on deploy"
#
# Guide: docs/deploy-dokploy.md

services:
  api:
    image: ghcr.io/daniel-huudek/church-app/api:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: church-app-api
    restart: unless-stopped
    expose:
      - "3030"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=192
      - PORT=3030
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/church_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3030/auth/google/callback}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-}
      - AWS_S3_PUBLIC_BASE_URL=${AWS_S3_PUBLIC_BASE_URL:-}
      - AWS_S3_ENDPOINT=${AWS_S3_ENDPOINT:-}
      - AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-}
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - church-app-network
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 320m
    mem_reservation: 128m
    cpus: 0.50

  # Public site (nginx). Domain is set in Dokploy → Domains → service `web` → port 80.
  # WEB_API_URL is injected at container start into /config.js for the browser.
  web:
    image: ghcr.io/daniel-huudek/church-app/web:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: church-app-web
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - WEB_API_URL=${WEB_API_URL}
    networks:
      - church-app-network
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    mem_reservation: 32m
    cpus: 0.20

  postgres-db:
    image: postgres:16-alpine
    container_name: church-app-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=church_db
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_connections=100
      - -c
      - work_mem=2MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - church-app-network
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 192m
    mem_reservation: 96m
    cpus: 0.40

networks:
  church-app-network:
    driver: bridge
  # So Dokploy Traefik can reach containers when you attach Domains in the UI.
  dokploy-network:
    external: true

volumes:
  postgres-data:
